<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dmitriy | Fullstack Разработчик</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="description" content="Создаю сайты, веб-приложения, Telegram-ботов, автоматизацию и ИИ-решения.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <script>
        function sendViaEmail() {
            const name = document.getElementById('formName').value.trim();
            const contact = document.getElementById('formContact').value.trim();
            const message = document.getElementById('formMessage').value.trim();
            const resultDiv = document.getElementById('formResult');

            if (!name || !contact || !message) {
                alert('Пожалуйста, заполните все поля');
                return;
            }

            const myEmail = "Demon.osipov2011@yandex.ru";
            const subject = encodeURIComponent("Заявка с сайта: " + name);
            const body = encodeURIComponent("Здравствуйте!\n\nМеня зовут: " + name + "\nМой контакт: " + contact + "\n\nОписание проекта:\n" + message + "\n\n---\nОтправлено с сайта-портфолио");

            // Открываем почтовый клиент
            window.location.href = "mailto:" + myEmail + "?subject=" + subject + "&body=" + body;

            // Показываем данные для копирования
            const textToCopy = "Имя: " + name + "\nКонтакт: " + contact + "\n\nПроект:\n" + message;
            
            // Безопасное экранирование кавычек для HTML-атрибута
            const escapedText = textToCopy.replace(/'/g, "\\x27").replace(/"/g, "&quot;");

            resultDiv.className = "mt-4 p-4 rounded-xl text-center bg-green-500/10 border border-green-500/30 text-green-400";
            resultDiv.innerHTML = '<p class="mb-2 font-semibold">Заявка готова!</p><p class="text-sm mb-3">Если почта не открылась, скопируйте данные:</p><div class="bg-darker p-3 rounded-lg text-left text-xs mb-3 font-mono">' + textToCopy.replace(/\n/g, '<br>') + '</div><button onclick="copyData(\'' + escapedText + '\')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm text-white">📋 Скопировать</button>';
            resultDiv.classList.remove('hidden');
        }

        function copyData(text) {
            const cleanText = text.replace(/&quot;/g, '"').replace(/\x27/g, "'");
            navigator.clipboard.writeText(cleanText).then(function() {
                alert('✅ Скопировано! Отправьте эти данные в Telegram или почту.');
            }).catch(function() {
                alert('Не удалось скопировать автоматически. Скопируйте вручную.');
            });
        }
    </script>
</body>
</html>
